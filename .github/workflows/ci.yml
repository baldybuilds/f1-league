name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  branch-rule:
    name: Branch rule (PRs into main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject PRs into main from disallowed branches
        run: |
          if [[ "${{ github.head_ref }}" != "development" && "${{ github.head_ref }}" != hotfix/* ]]; then
            echo "PRs into main must come from 'development' or a 'hotfix/*' branch (got '${{ github.head_ref }}')."
            exit 1
          fi

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  unit-tests:
    runs-on: ubuntu-latest
    # Several tests hit the real Neon `development` branch directly (session,
    # login-token, league and invite flows) - they create and clean up their
    # own rows. Secrets aren't available to `pull_request` runs triggered
    # from a fork, so this job would fail for an external contributor's PR;
    # not a concern while this stays a private/friends-only repo.
    env:
      APP_ENV: development
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --run

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      # Placeholders: env.ts only checks these are set. Nothing in this test
      # queries the DB or sends email yet - use real secrets once one does.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      RESEND_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e

  personal-data-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:data-map

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # --omit=dev: only shipped code is audited here. Dev-tool CVEs (e.g. deep in
      # netlify-cli's own dependency tree) are tracked separately since they don't
      # ship, and are often unfixable on our end until the tool's next release.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
